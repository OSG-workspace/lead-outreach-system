icp_name: US Healthcare Staffing — Credential-Monitoring Agent
description: >
  Mid-market US healthcare staffing agencies (travel nursing, allied health,
  locum tenens; $7.5M-$100M revenue, 20-150 internal staff). Offer: a
  credential-expiration monitoring + document-chasing agent — a provider
  stuck in credentialing costs the agency $6-8K/month, and timelines eat 20+
  staff hours per application. Runner-up offer (contract-heavy agencies,
  200+ on assignment): redeployment. NEVER pitch candidate engagement /
  screening / scheduling — that's owned by Paradox, Sense, and Bullhorn.
  Fixed copy per pitch.json.
  See vault/lead-outreach/targeting/us-staffing-scope.md.
geography: US
country_filter: US
vertical: staffing
