# EU + neighboring-Europe Hotels — AI Receptionist campaign
# Footprint widened 2026-07-15 (commit 393f37a) from the original ES/IT/FR-only
# scope to the 19 countries actually listed in countries.txt/queries.txt, to fix
# a volume collapse (37 qualified -> 8 contacted on the ES/IT/FR-only queries).
# pitch.json must stay footprint-agnostic (no per-country language claims) since
# most sends now land outside ES/IT/FR — see countries.txt for the exact list.
name: eu-hotels-receptionist
channel: email
draft_mode: template          # fixed AI-receptionist pitch via pitch.json
# Sourcing (declared in sourcing.json, the single Stage-2 contract every
# fixture has): method "map" — deterministic OSM enumeration of tourism=hotel
# per city via source_overpass.py, region by region, walking the per-vertical
# fired-city ledger so each fire covers FRESH cities. Switched 2026-07-17:
# the DDG search method's ranked top-10-per-query ceiling kept resurfacing
# the same famous hotels (3 OSM cities -> 272 usable candidates in ~30s /
# 0 LLM tokens vs 108 merged from 141 Haiku agents on the 2026-07-16 DDG
# run). queries.txt is kept as a fallback — flip sourcing.json back to
# {"method":"search","agent":"source-agent-worldwide"} to use it.
countries: [ES, IT, FR, MC, PT, GR, DE, AT, CH, NL, BE, LU, CZ, HU, HR, SI, ME, TR, DK, SE, NO, FI, IS, IE, GB, PL, RO, SK, BG, MT, CY]  # keep in sync with countries.txt

target:
  vertical: hotels
  regions:
    - Western & Southern Europe (Spain incl. Mallorca, Italy, France, Portugal, Greece)
    - Central Europe (Germany, Austria, Switzerland, Netherlands, Belgium, Czechia, Hungary)
    - Balkans & Turkey (Croatia, Turkey)
    - Nordics & British Isles (Denmark, Sweden, Norway, Ireland, UK)
  # QUALIFIED CLIENT = a BIG hotel with HIGH call volume. Small B&Bs and
  # quiet guesthouses are NOT the target — they don't have the missed-call
  # problem the AI receptionist solves.
  must_be:
    - large property (4-5 star, resort, spa, or conference hotel; many rooms)
    - high call volume / phone-led direct booking (reception is a bottleneck)
    - reachable at a direct, non-generic decision-maker email (GM / owner /
      revenue or front-office manager) — generic info@/reservations@ is dropped
  exclude:
    - small B&Bs, single-room guesthouses, low-traffic rural lodgings
    - chains with a staffed central call center (already solved with people)
    - properties whose only booking path is a modern self-serve engine with no
      phone bottleneck

pitch: AI receptionist for overflow + after-hours calls. 24/7, speaks English
  plus the major languages of the European hospitality market (no specific
  languages named in copy — the footprint is too wide to list accurately).
  Books reservations into the system. Zero setup, commission only. Fixed copy
  in pitch.json (no per-lead variation).

qualification:
  # Enforced in the chain (Stage 5.3 qualify gate), not just by queries:
  size_volume_gate: true        # hotel leads must show a big/high-volume signal
  min_score: 82
  non_generic_email_required: true   # enforced at Stage 5.5 enrichment
  # No enrich_cap.txt is set for this run, so the system default
  # (ENRICH_MAX_LEADS=250, a safety ceiling not a throttle) applies: every
  # qualified lead gets enriched. Verified 2026-07-16 against the
  # 2026-07-15-eu-hotels-1 run: capping to a top-80 subset by fit would have
  # captured only 45% of the actual sends while saving a trivial number of
  # cheap Haiku enrichment calls — not a worthwhile trade. Do not add a cap
  # here without re-running that trade-off analysis.
