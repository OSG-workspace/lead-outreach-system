# GCC outreach-system campaign (2026-07-27 GTM research)
target:
  description: "GCC businesses that already generate inbound leads or run recurring
    outbound at volume, and are staffed to handle it manually: Dubai/Sharjah real
    estate brokerages first (paid portal leads, speed-to-lead decides the sale),
    then training/education admissions and insurance renewals."
  countries: [AE, SA, QA]
  business_type: lead-heavy and renewal-heavy service businesses
wedge: manual outreach capacity, one person sends ~50 messages a day
signals_of_fit:
  - paid lead generation visible (portal listings, lead-form or click-to-WhatsApp ads)
  - hiring telesales / call centre / SDR / collections roles
  - large agent roster or listing count relative to team size
  - reviews complaining about no callback or being unreachable
disqualify:
  - no reachable decision-maker email
notes:
  - Research flags Dubai RERA bans real estate COLD-CALLING outright and UAE TDRA
    gates cold marketing calls. That constrains what a CUSTOMER may do with the
    product; it is a live objection to expect on calls, not an outreach blocker here.
  - Salla/Zid COD merchants are a Tier-1 vertical in the research but cannot be
    sourced from OSM (online stores have no map presence). Separate source needed.
